name: Desktop App Build (Pake)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate Icons
        run: npm run generate-icons
        
      - name: Install Pake
        run: npm install -g pake-cli
        
      - name: Build macOS App
        run: pake https://marsnav.vercel.app --name MarsNav --icon assets/marsnav-icon.png --transparent
        
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarsNav-macOS
          path: "*.dmg"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate Icons
        run: npm run generate-icons
        
      - name: Install Pake
        run: npm install -g pake-cli
        
      - name: Build Windows App
        run: pake https://marsnav.vercel.app --name MarsNav --icon assets/marsnav-icon.ico
        
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarsNav-Windows
          path: "*.exe"
