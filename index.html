    <script>
      // Defensive guard for browser extensions attempting to proxy window.fetch
      try {
        let _activeFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _activeFetch;
          },
          set(newFetch) {
            _activeFetch = newFetch;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Safe fallback if environment prohibits redefinition
      }
    </script>
